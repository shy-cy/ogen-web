<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ogen admin · Roster</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700;800&display=swap" rel="stylesheet">
<!-- Quill, the same editor and version admin/activities.html loads for the
     activity body. A refusal is the one message an admin may rewrite before it
     is sent, and it is written in the same place, in the same way. As there,
     js/registrations-admin.js falls back to a plain textarea if this does not
     load, so a CDN outage costs formatting rather than the ability to send. -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="admin-bar">
  <h1>Ogen admin</h1>
  <a href="/admin/activities.html" style="color:#fff;font-size:12.5px;font-weight:700;opacity:.8;">Activities</a>
  <a href="/admin/registrations.html" style="color:#fff;font-size:12.5px;font-weight:700;">Roster</a>
  <a href="/admin/families.html" style="color:#fff;font-size:12.5px;font-weight:700;opacity:.8;">Families</a>
  <a href="/admin/users.html" style="color:#fff;font-size:12.5px;font-weight:700;opacity:.8;">Admins</a>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button type="button" id="logout">Sign out</button>
</div>

<div class="wrap" id="app" hidden>
  <div id="no-access" class="msg err" hidden></div>

  <div class="layout" id="tool">
    <div class="sidebar">
      <div class="panel">
        <h2>Activities</h2>
        <div class="picker" id="picker"></div>
        <!-- Drop-in only, and hidden on a course: a course creates no
             per-session records, so there is no register to open. -->
        <button type="button" class="add-btn" id="btn-codes" style="margin-top:12px;" hidden>Check-in codes</button>
        <!-- Drop-in only, for the same reason: a course sells nothing in
             advance, so there is nothing here to list. -->
        <button type="button" class="add-btn" id="btn-bundles" style="margin-top:12px;" hidden>Bundles bought</button>
        <button type="button" class="add-btn" id="btn-sweep" style="margin-top:12px;">Expire unanswered requests</button>
        <div class="hint" id="sweep-hint" style="margin-top:6px;">
          Runs nightly on its own. The place is already free either way — this only
          updates what the queue says and tells the family.
        </div>
      </div>
    </div>

    <div class="main">
      <div id="messages"></div>

      <div class="panel" id="queue-panel" hidden>
        <h2 id="queue-title">Queue</h2>
        <div class="capacity-line" id="capacity"></div>
        <div id="queue"></div>
      </div>

      <div class="panel" id="bundles-panel" hidden>
        <h2>Bundles bought</h2>
        <div id="bundles"></div>
      </div>

      <div class="panel" id="codes-panel" hidden>
        <h2>Check-in codes</h2>
        <div id="codes"></div>
      </div>

      <div class="panel" id="account-panel" hidden>
        <h2 id="account-title">Account</h2>
        <div id="account-body"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<!-- Draws the check-in QR codes. A QR is a picture of a string, so the server
     returns the string and this makes the picture; js/registrations-admin.js
     prints the address under every code, so a CDN outage costs the picture and
     not the ability to use it. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/js/admin-session.js"></script>
<script src="/js/registrations-admin.js"></script>
</body>
</html>
