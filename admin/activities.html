<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ogen admin · Activities</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700;800&display=swap" rel="stylesheet">
<!-- Quill, the same editor and version the Shirat HaYam admin uses for its body
     fields. Loaded from a CDN because this project has no build step; the admin
     is behind a login and is noindex, and js/activities-admin.js falls back to
     plain textareas if it does not load, so a CDN outage costs formatting
     rather than the ability to edit. -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<div class="admin-bar">
  <h1>Ogen admin</h1>
  <a href="/admin/activities.html" style="color:#fff;font-size:12.5px;font-weight:700;">Activities</a>
  <a href="/admin/registrations.html" style="color:#fff;font-size:12.5px;font-weight:700;opacity:.8;">Roster</a>
  <a href="/admin/families.html" style="color:#fff;font-size:12.5px;font-weight:700;opacity:.8;">Families</a>
  <a href="/admin/users.html" style="color:#fff;font-size:12.5px;font-weight:700;opacity:.8;">Admins</a>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button type="button" id="logout">Sign out</button>
</div>

<!-- Stays hidden until `auth` resolves, so a role without access never sees
     a half-rendered tool. -->
<div class="wrap" id="app" hidden>
  <div id="no-access" class="msg err" hidden></div>

  <div class="layout" id="tool">
    <div class="sidebar">
      <div class="panel">
        <h2>Activities</h2>
        <div class="picker" id="picker"></div>
        <button type="button" class="add-btn" id="new-activity" style="margin-top:12px;">+ New activity</button>
      </div>
    </div>

    <div class="main">
      <div id="conflict-box"></div>

      <!-- Panel order follows the order an activity is actually filled in:
           what it IS, then what it SAYS, then who runs it, then the facts a
           reader scans, then questions, then the things written once and left
           alone. -->
      <div class="panel">
        <h2>Settings</h2>
        <div class="settings-grid" id="settings"></div>
        <!-- The square picture belongs with the other things that identify the
             activity rather than in a panel of its own. -->
        <div id="card-image-panel" style="margin-top:24px;">
          <h3 data-hint="A square picture, shown at the top of the activity's own page and on the activities listing. Any shape is accepted and cropped to a square from the centre, so keep the subject — and any text — away from the edges. Shared links use the share image in Search &amp; sharing, not this one.">Card image</h3>
          <div id="card-image"></div>
        </div>
      </div>

      <div class="panel">
        <h2>Content</h2>
        <div id="fields"></div>
      </div>

      <div class="panel" id="list-teachers-panel">
        <h2 data-hint="Any number. They render as a row that wraps.">Teachers</h2>
        <div class="items" id="list-teachers"></div>
        <button type="button" class="add-btn" data-add="teachers" style="margin-top:12px;">+ Add a teacher</button>
      </div>

      <div class="panel" id="list-sponsors-panel">
        <h2>Sponsors</h2>
        <div class="items" id="list-sponsors"></div>
        <button type="button" class="add-btn" data-add="sponsors" style="margin-top:12px;">+ Add a sponsor</button>
      </div>

      <!-- ⚠ ONE PANEL CALLED "ACTIVITY FACTS" HELD ALL THREE OF THESE, and it was
           too much of a mixture to read: a list of groups, a free-text box, four
           price fields, a late-booking block, a repeatable list of bundles and
           nine visibility checkboxes, under one heading, in one scroll. Three
           unrelated jobs sharing a panel is the shape somebody reported as "very
           bad UX" — and the evidence was already in the data, where
           beit-midrash's group-size override had been filled in with "Dates will
           be announced soon", a note about dates typed into the box that
           replaces the group-size line because that box had no context of its
           own.

           They are three panels now, in the order the questions are asked: who
           meets, what it costs, and what of it is published. -->

      <!-- Seven of the nine facts belong to a GROUP — ages, schedule, dates,
           language, level, room, exact address — and are edited on that group's
           own page, reached from this list. The free-text override sits here
           rather than beside the price because what it overrides is the line
           this list produces. -->
      <div class="panel">
        <h2>Groups</h2>
        <div id="groups-fields"></div>
      </div>

      <!-- One price whichever group a family joins. That is the rule the
           equal-total-hours validation exists to keep true. -->
      <div class="panel">
        <h2>Price</h2>
        <div id="price-fields"></div>
      </div>

      <!-- ⚠ ITS OWN PANEL, because it governs facts from BOTH of the two above
           and from every group's page. Folded into either one it would read as
           covering only that one. It is a policy about the published page rather
           than a value, which is also why there is ONE control here rather than
           the same checkbox repeated on every group's page — the same setting
           editable from two places is a trap this codebase has already met. -->
      <div class="panel">
        <h2 data-hint="Every fact is published unless it is ticked here. A members-only fact is left out of the page ENTIRELY &mdash; never rendered and hidden, because the file is static and anyone can read its source. It applies to the whole activity, so a fact every group fills in is published, or none of them is.">What is published</h2>
        <div id="visibility-fields"></div>
      </div>

      <!-- What a registration system will read off this activity. None of it is
           words: one answer serves all three languages, exactly like the robots
           flag and the share image, so a role permitted to edit only Russian
           cannot move a cutoff date on the Hebrew page.

           Which fields appear depends on the activity TYPE, and the fields a
           type does not draw are kept rather than cleared — see
           mergeRegistration on the server. Switch a course to a drop-in and back
           and the term settings are still there. -->
      <div class="panel" id="registration-panel">
        <h2 data-hint="Nothing here is published on the page. It is what the registration system will read when it exists. Changing any of it applies to registrations taken afterwards only &mdash; everything already submitted keeps the terms it was given.">Registration</h2>
        <div id="registration-fields"></div>
      </div>

      <div class="panel" id="list-faq-panel">
        <h2>FAQ</h2>
        <div class="items" id="list-faq"></div>
        <button type="button" class="add-btn" data-add="faq" style="margin-top:12px;">+ Add a question</button>
      </div>

      <!-- Search and share, last and on its own. These are written once and then
           left alone; everything above is what an admin opens this form to
           change. Sitting among the content fields, "Meta description" read as
           more body copy to write. -->
      <div class="panel" id="seo-panel">
        <h2 data-hint="How this activity appears in search results and when someone shares the link. Leave a field empty and the page falls back to the title and the site defaults.">Search &amp; sharing</h2>
        <div id="seo-fields"></div>
        <div id="seo-options" style="margin-top:18px;"></div>
        <!-- The share card. Without one, a shared link uses the site's own
             og-image.jpg, which is a perfectly good default. -->
        <div id="share-image" style="margin-top:18px;"></div>
      </div>

      <!-- Sticky action bar. It is a direct child of .main on purpose: as its
           own .panel the containing block was exactly its own height, so
           position:sticky had no scroll range and it never actually stuck —
           the buttons ended up 3000px down the page. #messages lives inside
           it so feedback appears where the controls are, rather than at the
           top of a form you have scrolled far past. -->
      <div class="action-bar">
        <div id="messages"></div>
        <div class="actions">
          <button type="button" class="btn btn-draft" id="btn-draft">Save draft</button>
          <button type="button" class="btn btn-preview" id="btn-preview">Preview</button>
          <button type="button" class="btn btn-publish" id="btn-publish">Publish</button>
          <button type="button" class="btn btn-unpublish" id="btn-unpublish">Unpublish</button>
          <button type="button" class="btn btn-delete" id="btn-delete">Delete&hellip;</button>
        </div>
      </div>

      <div class="panel" id="preview-panel" hidden>
        <h2 data-hint="Rendered by the same function that publishes. What you see here is what gets committed.">Preview</h2>
        <div class="preview-tabs" id="preview-tabs"></div>
        <iframe id="preview-frame" title="Preview"></iframe>
        <ul class="file-list" id="preview-files"></ul>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<script src="/js/admin-session.js"></script>
<script src="/js/admin-help.js"></script>
<script src="/js/image-optimize.js"></script>
<script src="/js/repeatable-items.js"></script>
<script src="/js/activities-admin.js"></script>
</body>
</html>
