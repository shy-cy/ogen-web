     behind it is one family's private record.

     table in js/member-account.js, the same way the nav, the footer and the
     contact form each carry their own — so a wording change is an edit to one
     table rather than to twelve HTML files in three languages, which is the
     shape that guarantees the Russian drifts from the Hebrew.

     data-view is the whole router. The three token-bearing views exist as real
     URLs because the account emails already point at them, and those links are
     in inboxes. -->
