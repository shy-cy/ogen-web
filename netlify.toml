# Static site — no build step for the site itself. Pretty URLs let /en/about
# resolve to /en/about.html and strip trailing .html. The Netlify Functions
# under netlify/functions back the admin only; npm install runs for them.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The pending-registration sweep. It rewrites requests nobody answered to
# `expired` and emails the family; the CAPACITY numbers do not depend on it,
# because holdsASpot() in _registration.js already treats a lapsed hold as
# holding nothing. So a missed run costs a stale queue, never a double-booked
# place. 06:00 UTC is early morning in Cyprus — before anyone is working, and
# the messages land at the start of the day rather than in the middle of a night.
[functions."registration-sweep"]
  schedule = "0 6 * * *"

[build.processing.html]
  pretty_urls = true

# Basic security + caching headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hand-placed assets — logos, partner marks, the share card, the favicons. These
# are committed by hand, never move, and never 404, so a year is honest.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin-managed uploads, and deliberately NOT immutable.
#
# Netlify applies these headers to error responses too, so a 404 under this path
# was cached for a year and never revalidated. Files here legitimately appear and
# disappear — a publish replaces one picture with another — and a reader who
# asked for one during a deploy got a 404 that STUCK: the image stayed broken in
# that browser for good, through any number of ordinary reloads, because it had
# stopped asking. Only a hard reload cleared it. That happened to a real teacher
# photo on this site.
#
# `immutable` is not needed to cache these well: the filenames carry a content
# hash, so anything unchanged keeps its URL and revalidates to a cheap 304, and
# anything changed arrives at a new URL anyway. The short max-age is what lets a
# transient 404 expire instead of becoming permanent.
#
# This rule is more specific than the one above; that it actually wins is
# verified against the deployed site, not assumed from the documentation.
[[headers]]
  for = "/images/activities/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# The admin's own assets are NEVER cached.
#
# Netlify's default for static files is four hours, and that default applied to
# the admin: a change to the form shipped, deployed, and then did not reach the
# person using it for up to four hours, because their browser had stopped
# asking. It looked exactly like the feature had not been built -- three of them
# were reported missing while the server was already serving them.
#
# The trade is nothing worth keeping. These files are small, they are fetched by
# one or two people rather than by visitors, and no-cache still revalidates to a
# cheap 304 when the file has not moved. Correctness matters more here than
# bytes: an admin publishing to a live site must be running the code that was
# deployed, not the code that was deployed this morning.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/activities-admin.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/admin-session.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/repeatable-items.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/image-optimize.js"
  [headers.values]
    Cache-Control = "no-cache"

# Friendly function routes. Must come BEFORE the catch-all 404 rule.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Admin pages are static files; the gate is on the API, not the route.
# Keep them out of search results regardless.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Serve the localized 404 for unknown paths.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
