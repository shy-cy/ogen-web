# Static site — no build step for the site itself. Pretty URLs let /en/about
# resolve to /en/about.html and strip trailing .html. The Netlify Functions
# under netlify/functions back the admin only; npm install runs for them.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The pending-registration sweep. It rewrites requests nobody answered to
# `expired` and emails the family; the CAPACITY numbers do not depend on it,
# because holdsASpot() in _registration.js already treats a lapsed hold as
# holding nothing. So a missed run costs a stale queue, never a double-booked
# place. 06:00 UTC is early morning in Cyprus — before anyone is working, and
# the messages land at the start of the day rather than in the middle of a night.
[functions."registration-sweep"]
  schedule = "0 6 * * *"

[build.processing.html]
  pretty_urls = true

# Basic security + caching headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # LET THE EDGE CACHE THE HTML.
    #
    # Every other path here had a Cache-Control and HTML had none, so Netlify's
    # default `max-age=0, must-revalidate` applied — and Cloudflare will not
    # cache a response like that. Measured against www.ogen.cy, every page
    # answered `cf-cache-status: DYNAMIC`: an origin round trip on EVERY view,
    # 0.76-4.96s on an activity page and 6.21s on the homepage, while
    # /shared.css sat beside it at 0.33s and REVALIDATED because the edge was
    # allowed to keep it.
    #
    # s-maxage speaks only to a shared cache, so this changes nothing for the
    # browser: max-age stays 0 and a returning visitor still revalidates, which
    # is what keeps a publish visible.
    #
    # ⚠ THE SHARED CACHE THAT HONOURS IT IS NETLIFY'S, NOT CLOUDFLARE'S. This
    # was added expecting Cloudflare to start caching the HTML and it does not:
    # measured after deploying, every page still answers `cf-cache-status:
    # DYNAMIC`, because Cloudflare caches by file EXTENSION by default and HTML
    # is not in that set — no Cache-Control value changes that on its own, only
    # a Cache Rule in the dashboard. What did change is Netlify's own CDN, which
    # previously revalidated to origin on every request and now serves 60
    # seconds of repeat traffic itself. That alone took the homepage from 6.21s
    # to ~0.30s and an activity page from 0.76-4.96s to ~0.29s, so the header
    # earns its place — just not through the hop it was aimed at.
    #
    # SIXTY SECONDS, because that is the window a stale page can be served in
    # after a publish — and a Netlify deploy already takes about a minute to go
    # live, so it adds nothing a publisher can perceive. Do not raise it without
    # purging Cloudflare on deploy; the admin publishes to this site all day and
    # a ten-minute edge cache means ten minutes of an admin reloading a page
    # that has already changed and concluding the publish failed.
    #
    # ⚠ Cloudflare's Browser Cache TTL must stay "Respect Existing Headers" for
    # any of this to mean what it says. See the Blobs/CDN note in CLAUDE.md.
    Cache-Control = "public, max-age=0, must-revalidate, s-maxage=60"

# Hand-placed assets — logos, partner marks, the share card, the favicons. These
# are committed by hand, never move, and never 404, so a year is honest.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin-managed uploads, and deliberately NOT immutable.
#
# Netlify applies these headers to error responses too, so a 404 under this path
# was cached for a year and never revalidated. Files here legitimately appear and
# disappear — a publish replaces one picture with another — and a reader who
# asked for one during a deploy got a 404 that STUCK: the image stayed broken in
# that browser for good, through any number of ordinary reloads, because it had
# stopped asking. Only a hard reload cleared it. That happened to a real teacher
# photo on this site.
#
# `immutable` is not needed to cache these well: the filenames carry a content
# hash, so anything unchanged keeps its URL and revalidates to a cheap 304, and
# anything changed arrives at a new URL anyway. The short max-age is what lets a
# transient 404 expire instead of becoming permanent.
#
# This rule is more specific than the one above; that it actually wins is
# verified against the deployed site, not assumed from the documentation.
#
# ⚠ SIXTY SECONDS, DOWN FROM 300, AND THE REASON IS THAT IT HAPPENED AGAIN.
# Two teacher photos published in one commit with the HTML that references them
# answered 404 on the live site while both files were sitting in the tree — and
# `cf-cache-status: HIT`, `age: 211`, proved the 404 itself was the cached
# thing. Cloudflare caches by file extension, so .jpg is exactly what it DOES
# keep, and it had asked during the seconds between the HTML reaching an edge
# and the image doing so.
#
# The 300 was already this rule working: it is what made a permanent broken
# image into a five-minute one. But five minutes is still visible, and it is
# visible to precisely the wrong person — whoever just pressed Publish and
# immediately opened the page, who is the FIRST request for every new URL and
# therefore the one who fills the cache with whatever the origin says at that
# instant.
#
# Sixty is the same trade one notch tighter. Revalidation costs nothing here:
# the names carry a content hash, so an unchanged file answers 304 in a few
# hundred bytes. The real fix is purging Cloudflare on deploy, which needs an
# API token and a build hook and lives outside this repository; until that
# exists, this is the cheap half.
[[headers]]
  for = "/images/activities/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

# The admin's own assets are NEVER cached.
#
# Netlify's default for static files is four hours, and that default applied to
# the admin: a change to the form shipped, deployed, and then did not reach the
# person using it for up to four hours, because their browser had stopped
# asking. It looked exactly like the feature had not been built -- three of them
# were reported missing while the server was already serving them.
#
# The trade is nothing worth keeping. These files are small, they are fetched by
# one or two people rather than by visitors, and no-cache still revalidates to a
# cheap 304 when the file has not moved. Correctness matters more here than
# bytes: an admin publishing to a live site must be running the code that was
# deployed, not the code that was deployed this morning.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/activities-admin.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/admin-session.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/repeatable-items.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/image-optimize.js"
  [headers.values]
    Cache-Control = "no-cache"

# ⚠ THE PAYMENT LINK MUST NEVER BE CACHED BY ANYTHING.
#
# /* above carries s-maxage=60 so a shared cache may serve a minute of repeat
# HTML traffic itself. Applied to /pay that is a serious bug rather than a
# saving: the response is a 302 to a ONE-TIME Stripe Checkout URL minted for one
# family, and a shared cache holding it for sixty seconds would hand the next
# reader of the next payment email somebody else's session. The function sets
# no-store itself; this makes sure nothing here quietly puts s-maxage back.
[[headers]]
  for = "/pay"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

# Friendly function routes. Must come BEFORE the catch-all 404 rule.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The emailed payment link. A short path because it is a URL a person sees, and
# a rewrite rather than a redirect so the function's own 302 — to Stripe, or to
# a page that explains why not — is what the reader follows.
[[redirects]]
  from = "/pay"
  to = "/.netlify/functions/pay-link"
  status = 200

# Admin pages are static files; the gate is on the API, not the route.
# Keep them out of search results regardless.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Serve the localized 404 for unknown paths.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
